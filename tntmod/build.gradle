plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Minecraft 26.1+ is unobfuscated and Yarn is discontinued: no mappings line is needed.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Ported LuckyTNTLib (26.2). 26.2 is unobfuscated, so the prebuilt jar is already in the
	// named (Mojang) namespace and needs no remapping — plain implementation is enough for both
	// compile and runtime (Fabric loader scans the classpath for its fabric.mod.json).
	implementation files("${rootProject.projectDir}/../dist/fabric-luckytntlib-26.2-0.100.6.1.jar")

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
	it.options.compilerArgs += ["-Xmaxerrs", "2000", "-Xmaxwarns", "0"]
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
